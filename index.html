<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="wrap">
        <h2>Login</h2>
        
        <form>
            <label>Username</label><br>
            <input type="text" class="inp" placeholder="Enter username"><br><br>
            
            <label>Password</label><br>
            <input type="password" class="inp" placeholder="Enter password"><br><br>
            
            <button type="submit" id="btn">Login</button>
        </form>
    </div>

</body>
</html>
